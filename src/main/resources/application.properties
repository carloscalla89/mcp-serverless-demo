# ---------------------------------------------------------------------------
# Identidad de la aplicación
# ---------------------------------------------------------------------------
quarkus.application.name=mcp-serverless-demo

# ---------------------------------------------------------------------------
# HTTP
# ---------------------------------------------------------------------------
quarkus.http.port=8080
quarkus.http.root-path=/

# ---------------------------------------------------------------------------
# Jackson (usado por el REST Client)
# ---------------------------------------------------------------------------
quarkus.jackson.fail-on-unknown-properties=false

# ---------------------------------------------------------------------------
# REST Client -> open.er-api.com (API pública, sin API key)
# ---------------------------------------------------------------------------
quarkus.rest-client.currency-rate.url=https://open.er-api.com

# ---------------------------------------------------------------------------
# MCP Server (Streamable HTTP en /mcp)
# ---------------------------------------------------------------------------
# Modo "stateless" simulado: cada request crea su propia sesión MCP.
# Ideal para serverless (Cloud Run) y para probar con Postman/curl sin sesión.
quarkus.mcp.server.http.streamable.auto-init=true

# Logging del tráfico JSON-RPC en dev (muy útil para mostrar en la demo)
%dev.quarkus.mcp.server.traffic-logging.enabled=true
%dev.quarkus.mcp.server.traffic-logging.text-limit=10000

# CORS para clientes MCP que corren en el navegador (MCP Inspector) en dev
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:6274,http://localhost:6277

# El chequeo anti DNS-rebinding solo aplica cuando el host es local (dev).
# En la demo local con Inspector lo desactivamos para evitar 403 por Origin.
%dev.quarkus.mcp.server.http.dns-rebinding-check.enabled=false

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
quarkus.log.level=INFO
quarkus.log.category."pe.com.incoda.mcpserverlessdemo".level=DEBUG
